<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GradLink Launch Board</title>
<!-- Generated by launch-board/generate.mjs from docs/checklists. Edit template.html, not index.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F3F6F9;--surface:#FFFFFF;--surface-2:#EDF2F6;--ink:#0B1622;--ink-2:#34465A;--muted:#5E6F82;--line:#D9E1E9;--track:#E3E9EF;
  --accent:#0A86AD;--accent-soft:rgba(10,134,173,.10);
  --st-in_progress:#0A86AD;--st-owner:#A57A06;--st-todo:#D93C41;--st-verify:#2F7FC1;--st-parked:#5F6E80;--st-done:#00897A;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;--body:"DM Sans",ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;--bg:#06101B;--surface:#0C1826;--surface-2:#112133;--ink:#E7F0F7;--ink-2:#B9C8D6;--muted:#8697AA;--line:#1D2E41;--track:#1A2A3C;
  --accent:#35D3FF;--accent-soft:rgba(53,211,255,.10);
  --st-in_progress:#35D3FF;--st-owner:#F7C948;--st-todo:#FF6B6B;--st-verify:#5AA9F0;--st-parked:#95A3B4;--st-done:#00C2A8;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,4vw,36px);font-weight:700;margin-top:6px}
.top p{margin:6px 0 0;color:var(--muted);max-width:66ch}
.stamp{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:17px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.summary{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.ring{position:relative;width:140px;height:140px}
.ring svg{width:140px;height:140px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font:700 32px/1 var(--display)}
.ring .c span{font-size:12px;color:var(--muted);margin-top:4px}
.sev h3{font-size:13px;font-weight:600;font-family:var(--body);color:var(--ink-2);margin-bottom:10px}
.stack{display:flex;height:28px;border-radius:4px;overflow:hidden;background:var(--track)}
.stack button{all:unset;cursor:pointer;height:100%;min-width:4px;transition:opacity .15s}
.stack.filtering button:not([aria-pressed="true"]){opacity:.3}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px}
.legend button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.legend button i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend button b{font-variant-numeric:tabular-nums}
.legend button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.node{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);transition:border-color .15s}
.node:hover{border-color:var(--accent)}
.node[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.node .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13.5px}
.node .t span{font-weight:500;color:var(--muted);font-size:12px}
.mini{display:flex;height:6px;border-radius:2px;overflow:hidden;background:var(--track)}
.mini i{display:block;height:100%}
.node .w{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.node .w i{width:7px;height:7px;border-radius:50%;display:inline-block}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:8px 13px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.search{flex:1;min-width:180px;max-width:340px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer}
.clear{all:unset;cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.af{font-size:12.5px;color:var(--muted)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.group-h{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.group-h h3{font-size:16px;font-weight:600;flex:1;min-width:160px}
.group-h .mini{width:140px}
.group-h .n{font-size:12.5px;color:var(--muted)}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:13px 18px;border-top:1px solid var(--line);align-items:start}
.item:first-of-type{border-top:0}
.dot{width:14px;height:14px;border-radius:3px;margin-top:4px;border:2px solid currentColor}
.item.done .dot{background:currentColor}
.ti{font-weight:600;font-size:14.5px;line-height:1.4}
.item.done .ti{color:var(--muted)}
.te{font-size:13px;color:var(--ink-2);margin-top:3px;max-width:82ch}
.meta{font:11.5px/1.6 var(--mono);color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.meta a{color:var(--muted)}
.meta a:hover{color:var(--accent)}
.tag{font:600 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:3px;white-space:nowrap;border:1px solid currentColor}
code{font:12.5px var(--mono);background:var(--surface-2);padding:1px 4px;border-radius:3px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
@media (max-width:900px){.summary{grid-template-columns:1fr;justify-items:start}.sev{width:100%}.areas{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.wrap{padding-inline:16px}.areas{grid-template-columns:1fr}.item{grid-template-columns:18px 1fr}.item .tag{grid-column:2;justify-self:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">Generated from docs/checklists</div>
      <h1>GradLink Launch Board</h1>
      <p>Everything left before launch, what is in progress, and what is done. To change an item, tick it in its checklist file. The board rebuilds when that reaches main.</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>
  <section class="panel"><div class="summary" id="summary"></div></section>
  <section class="panel">
    <div class="panel-h"><h2>Areas</h2><span class="hint">Select an area to show only its items</span></div>
    <div class="areas" id="areas"></div>
  </section>
  <div class="controls">
    <div class="seg" role="group" aria-label="Group items">
      <button type="button" data-view="state" id="v-state">By status</button>
      <button type="button" data-view="area" id="v-area">By area</button>
    </div>
    <input id="q" class="search" type="search" placeholder="Search items, files, ids" aria-label="Search">
    <label class="chk"><input type="checkbox" id="hide-done" checked> Hide done</label>
    <span class="af" id="af"></span>
  </div>
  <div id="list" style="display:flex;flex-direction:column;gap:14px"></div>
</div>
<script>
(function(){
var D=/*__BOARD_DATA__*/null;
if(!D){document.getElementById("list").innerHTML='<div class="group empty">No data. Run node launch-board/generate.mjs.</div>';return}
var AREA={};D.areas.forEach(function(a){AREA[a.key]=a.name});
var ui={view:"state",q:"",hideDone:true,state:null,area:null};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function md(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")}
function col(s){return "var(--st-"+s+")"}
function cnt(list){var c={};D.stateOrder.forEach(function(s){c[s]=0});list.forEach(function(i){c[i.state]++});return c}
function src(i){return "https://github.com/"+D.repo+"/blob/"+D.branch+"/docs/checklists/"+i.area+".md?plain=1#L"+i.line}
function mini(list){var c=cnt(list),h='<span class="mini">';["done"].concat(D.openOrder).forEach(function(s){if(c[s])h+='<i style="flex:'+c[s]+';background:'+col(s)+'"></i>'});return h+'</span>'}

function summary(){
  var c=cnt(D.items),t=D.items.length,p=t?Math.round(c.done/t*100):0,C=2*Math.PI*58;
  var h='<div class="ring" role="img" aria-label="'+p+'% done"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="58" fill="none" stroke="var(--track)" stroke-width="13"/><circle cx="70" cy="70" r="58" fill="none" stroke="var(--st-done)" stroke-width="13" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+(C*(1-p/100)).toFixed(2)+'"/></svg><div class="c"><b class="num">'+p+'%</b><span class="num">'+c.done+' of '+t+' done</span></div></div>';
  h+='<div class="sev"><h3>All items by status</h3><div class="stack'+(ui.state?' filtering':'')+'">';
  ["done"].concat(D.openOrder).forEach(function(s){if(c[s])h+='<button type="button" data-state="'+s+'" aria-pressed="'+(ui.state===s)+'" title="'+esc(D.states[s].label)+': '+c[s]+'" style="flex:'+c[s]+';background:'+col(s)+'"></button>'});
  h+='</div><div class="legend">';
  D.openOrder.concat(["done"]).forEach(function(s){h+='<button type="button" data-state="'+s+'" aria-pressed="'+(ui.state===s)+'"><i style="background:'+col(s)+'"></i>'+esc(D.states[s].label)+' <b>'+c[s]+'</b></button>'});
  h+='</div></div>';
  document.getElementById("summary").innerHTML=h;
}
function areas(){
  var h="";
  D.areas.forEach(function(a){
    var list=D.items.filter(function(i){return i.area===a.key}),c=cnt(list),open=list.length-c.done,w=null;
    for(var k=0;k<D.openOrder.length;k++){if(c[D.openOrder[k]]){w=D.openOrder[k];break}}
    h+='<button type="button" class="node" data-area="'+a.key+'" aria-pressed="'+(ui.area===a.key)+'"><span class="t">'+esc(a.name)+'<span class="num">'+c.done+'/'+list.length+'</span></span>'+mini(list)+'<span class="w">'+(w?'<i style="background:'+col(w)+'"></i>'+open+' left, '+c[w]+' '+esc(D.states[w].label.toLowerCase()):'<i style="background:var(--st-done)"></i>All done')+'</span></button>';
  });
  document.getElementById("areas").innerHTML=h;
}
function item(i){
  var meta='<a href="'+src(i)+'" target="_blank" rel="noopener">'+esc(i.area)+'.md:'+i.line+'</a><span>id '+esc(i.id)+'</span>';
  if(i.pr)meta+='<a href="'+esc(i.pr.url)+'" target="_blank" rel="noopener">PR #'+i.pr.number+(i.pr.draft?' (draft)':'')+': '+esc(i.pr.title)+'</a>';
  if(i.doneIn)meta+='<span>Done in "'+esc(i.doneIn)+'"</span>';
  return '<div class="item'+(i.state==="done"?' done':'')+'"><span class="dot" style="color:'+col(i.state)+'" aria-hidden="true"></span><div><div class="ti">'+md(i.title)+'</div><div class="te">'+md(i.detail)+'</div><div class="meta">'+meta+'</div></div><span class="tag" style="color:'+col(i.state)+'">'+esc(D.states[i.state].label)+'</span></div>';
}
function list(){
  var q=ui.q.trim().toLowerCase();
  var f=D.items.filter(function(i){
    if(ui.hideDone&&i.state==="done"&&ui.state!=="done")return false;
    if(ui.state&&i.state!==ui.state)return false;
    if(ui.area&&i.area!==ui.area)return false;
    if(q&&(i.title+" "+i.detail+" "+i.id+" "+AREA[i.area]).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var groups=ui.view==="state"
    ?D.openOrder.concat(["done"]).map(function(s){return{name:D.states[s].label,all:D.items.filter(function(i){return i.state===s}),items:f.filter(function(i){return i.state===s})}})
    :D.areas.map(function(a){return{name:a.name,all:D.items.filter(function(i){return i.area===a.key}),items:f.filter(function(i){return i.area===a.key})}});
  var h="";
  groups.forEach(function(g){
    if(!g.items.length)return;
    var c=cnt(g.all);
    h+='<section class="group"><div class="group-h"><h3>'+esc(g.name)+'</h3>'+(ui.view==="area"?mini(g.all)+'<span class="n num">'+c.done+'/'+g.all.length+' done</span>':'<span class="n num">'+g.items.length+'</span>')+'</div>';
    g.items.forEach(function(i){h+=item(i)});
    h+='</section>';
  });
  document.getElementById("list").innerHTML=h||'<div class="group empty">Nothing matches these filters.</div>';
  var parts=[];if(ui.area)parts.push(AREA[ui.area]);if(ui.state)parts.push(D.states[ui.state].label);
  document.getElementById("af").innerHTML=parts.length?'Showing '+esc(parts.join(", "))+' <button type="button" class="clear" data-clear="1">Clear filters</button>':'';
  document.getElementById("v-state").setAttribute("aria-pressed",ui.view==="state");
  document.getElementById("v-area").setAttribute("aria-pressed",ui.view==="area");
}
function all(){summary();areas();list()}
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.state){ui.state=ui.state===t.dataset.state?null:t.dataset.state;all();return}
  if(t.dataset.area){ui.area=ui.area===t.dataset.area?null:t.dataset.area;all();return}
  if(t.dataset.view){ui.view=t.dataset.view;list();return}
  if(t.dataset.clear){ui.area=null;ui.state=null;all();return}
});
document.getElementById("q").addEventListener("input",function(e){ui.q=e.target.value;list()});
document.getElementById("hide-done").addEventListener("change",function(e){ui.hideDone=e.target.checked;list()});
document.getElementById("stamp").textContent=D.updated?"Checklists last changed "+D.updated:"";
all();
})();
</script>
</body>
</html>
