# Deploys GradLink to the `gradlink` Worker after every push to main:
#
#   push to main ─► typecheck + lint ─► Neon schema ─► OpenNext build ─► wrangler deploy ─► health check
#
# Only main deploys, so work on other branches never replaces the live site.
# Launch board commits carry [skip ci] and do not trigger a deploy.
#
# Repository secrets (Settings, Secrets and variables, Actions):
#   CLOUDFLARE_API_TOKEN   API token with "Edit Cloudflare Workers" on the GradLink account
#   CLOUDFLARE_ACCOUNT_ID  that account's id
#   NEON_MIGRATE_URL       optional: the Neon owner role's connection string, used only
#                          for `npm run db:migrate`. The Worker itself uses the
#                          least-privilege role set as its DATABASE_URL secret.
# Until the Cloudflare secrets exist the job stops early with a notice instead of failing.
#
# The Worker's own secrets (DATABASE_URL, AUTH_SECRET, ADMIN_EMAILS, ...) are set once
# with `npx wrangler secret put` and are kept by every deploy (see README.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PRODUCTION_URL: https://gradleap.online

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_MIGRATE_URL: ${{ secrets.NEON_MIGRATE_URL }}
    steps:
      - name: Check the deploy secrets
        id: secrets
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deploy skipped: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy from main."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Typecheck and lint
        if: steps.secrets.outputs.ready == 'true'
        run: npm run check

      - name: Apply db/schema.sql to Neon (idempotent)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [[ -z "$NEON_MIGRATE_URL" ]]; then
            echo "::warning::NEON_MIGRATE_URL is not set, so the schema was not applied. Run npm run db:migrate before a deploy that changes db/schema.sql."
            exit 0
          fi
          DATABASE_URL="$NEON_MIGRATE_URL" npm run --silent db:migrate

      - name: Build and deploy the Worker
        if: steps.secrets.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.PRODUCTION_URL }}
        run: npm run deploy

      - name: Wait for the new version to answer with a database connection
        if: steps.secrets.outputs.ready == 'true'
        run: |
          streak=0
          for i in $(seq 1 60); do
            health=$(curl -sS "$PRODUCTION_URL/api/health" || true)
            if grep -q '"database":"connected"' <<<"$health"; then streak=$((streak + 1)); else streak=0; fi
            echo "attempt $i: $health (streak $streak)"
            [[ $streak -ge 5 ]] && exit 0
            sleep 3
          done
          echo "::error::$PRODUCTION_URL/api/health did not report a database connection."
          exit 1
