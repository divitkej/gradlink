<!-- GradLink — Supabase "Reauthentication" email (uses a 6-digit code, no link). Subject: Your GradLink verification code -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#050B14;padding:32px 16px;margin:0;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#0B1E33;border:1px solid rgba(255,255,255,0.08);border-radius:18px;overflow:hidden;">
      <tr><td style="height:4px;line-height:0;font-size:0;background:linear-gradient(90deg,#35D3FF,#00C2A8);">&nbsp;</td></tr>
      <tr><td style="padding:36px 36px 6px;text-align:center;">
        <img src="https://gradlink-theta.vercel.app/apple-icon" width="56" height="56" alt="GradLink" style="display:inline-block;border-radius:14px;" />
        <div style="margin-top:14px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.5px;"><span style="color:#F5F8FF;">Grad</span><span style="color:#35D3FF;">Link</span></div>
      </td></tr>
      <tr><td style="padding:16px 36px 0;text-align:center;">
        <h1 style="margin:0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:21px;font-weight:700;color:#F5F8FF;">Your verification code</h1>
        <p style="margin:14px 0 0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#9FB3C8;">Enter this code in GradLink to confirm it's you.</p>
      </td></tr>
      <tr><td align="center" style="padding:24px 36px 6px;">
        <div style="display:inline-block;padding:16px 28px;border-radius:14px;background-color:#071827;border:1px solid rgba(53,211,255,0.4);font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:34px;font-weight:700;letter-spacing:10px;color:#35D3FF;">{{ .Token }}</div>
      </td></tr>
      <tr><td style="padding:22px 36px 30px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);">
        <p style="margin:16px 0 0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6F86A3;">If you didn't request this, you can safely ignore this email.</p>
        <p style="margin:10px 0 0;font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;color:#6F86A3;">GradLink · Prepare students. Connect employers. Track outcomes.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
